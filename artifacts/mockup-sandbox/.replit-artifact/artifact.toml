kind = "design"
previewPath = "/__mockup/"
title = "Mockup Sandbox"
description = "Isolated previews for the Sayso home screen redesign. The production UI and behavior stay untouched until the user approves a direction."
version = "1.0.0"
id = "artifacts/mockup-sandbox"
router = "path"

[[services]]
name = "Component Preview Server"
paths = [ "/__mockup/" ]
localPort = 23636

[services.development]
run = "npm run dev"

[services.env]
PORT = "23636"
BASE_PATH = "/__mockup/"
