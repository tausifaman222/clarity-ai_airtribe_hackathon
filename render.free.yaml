# Free-plan Blueprint (no card needed): New → Blueprint → set "Blueprint Path" to render.free.yaml.
# Trade-offs: the free web service sleeps after 15 idle minutes (first visit then takes ~1 minute), and Render's
# free Postgres expires after 30 days. For launch, use render.yaml (paid plans, covered by credits) instead.
# Tables are created on each start (safe to repeat), because free services can't run a pre-deploy command.
services:
  - type: web
    name: clarity-ai
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: npm run db:migrate && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: clarity-db
          property: connectionString
      - key: LLM_PROVIDER
        value: groq
      - key: LLM_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: FALLBACK_LLM_API_KEY
        sync: false
      - key: FALLBACK_LLM_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: FALLBACK_LLM_MODEL
        value: gemini-flash-latest
      - key: PUBLIC_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

databases:
  - name: clarity-db
    plan: free
    region: singapore
    databaseName: clarity
    user: clarity
    postgresMajorVersion: "16"
