name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened?, description: "What did you expect instead?" }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: Steps to reproduce, placeholder: "1. Open …\n2. Click …\n3. See …" }
    validations: { required: true }
  - type: input
    id: browser
    attributes: { label: Browser and device, placeholder: "Chrome 130 on Android / Safari 18 on iPhone" }
  - type: textarea
    id: health
    attributes: { label: Output of /api/health, description: "Remove anything private. Never paste API keys.", render: json }
